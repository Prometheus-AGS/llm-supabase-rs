version: '3.8'

services:
  llm-supabase-rs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-supabase-rs
    restart: unless-stopped
    ports:
      - "8484:8080"
    environment:
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8080
      - RUST_LOG=info
      
      # Vertex AI Configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION:-us-east5}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-credentials.json
      - DEFAULT_MODEL=${DEFAULT_MODEL:-claude-sonnet-4-5@20250929}
      
      # Supabase Configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      
      # Optional Configuration
      - MODEL_CACHE_DIR=/app/data/models
      - LOG_LEVEL=${LOG_LEVEL:-info}
    
    volumes:
      # Mount GCP credentials
      - ${GCP_CREDENTIALS_PATH:-./gcp-credentials.json}:/app/credentials/gcp-credentials.json:ro
      # Mount data directory for persistence
      - llm_data:/app/data
      # Mount logs directory
      - llm_logs:/app/logs
    
    networks:
      - llm_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

volumes:
  llm_data:
    driver: local
  llm_logs:
    driver: local

networks:
  llm_network:
    driver: bridge