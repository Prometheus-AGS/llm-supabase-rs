[package]
name = "llm-supabase-rs"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "OpenAI-compatible API service with Vertex AI integration"

[dependencies]
# Web framework
axum = { version = "0.8.6", features = ["macros", "multipart"] }
axum-extra = { version = "0.10.3", features = ["typed-header"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs", "trace", "cors"] }
axum-tracing-opentelemetry = "0.32.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12.23", features = ["json", "stream", "multipart"] }

# Authentication
jsonwebtoken = { version = "10.0.0", features = ["use_pem", "rust_crypto"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "ansi"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.31.0"
tracing-appender = "0.2"  # For log rotation

# Metrics
prometheus = "0.14.0"
axum-prometheus = "0.9.0"

# GCP integration
gcp_auth = "0.12.3"

# ML/AI libraries (disabled for now due to version conflicts)
# candle-core = "0.9"
# candle-nn = "0.9"
# candle-transformers = "0.9"
# candle-datasets = "0.9"
# hf-hub = "0.4"
# tokenizers = "0.22"

# Database
# Aligning with rig-postgres which uses sqlx v0.8.6 to avoid libsqlite3-sys conflicts
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
futures = "0.3"
base64 = "0.22.1"
dotenv = "0.15"
rand = "0.9.2"

# Configuration
config = "0.15.18"

# Async streams
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1.5"
async-stream = "0.3"
async-trait = "0.1"
# Rig AI framework for LLM integrations
rig-core = "0.21.0"
# rig-postgres = "0.1.21"  # For future database integration
# rig-bedrock = "0.3.2"    # For AWS Bedrock fallback
# rig-fastembed = "0.2.12" # For embeddings

# ML/AI libraries (disabled due to CUDA requirements)
# mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", tag = "v0.6.0", features = ["cuda", "flash-attn"] }
# microsandbox = "0.1.2"



# Test configuration
[[test]]
name = "contract_health"
path = "tests/contract/test_health.rs"

[[test]]
name = "contract_chat"
path = "tests/contract/test_chat_completions.rs"

[[test]]
name = "contract_streaming"
path = "tests/contract/test_chat_streaming.rs"

[[test]]
name = "contract_models"
path = "tests/contract/test_models.rs"

# Integration test configuration
[[test]]
name = "integration_health"
path = "tests/integration/test_health_validation.rs"

[[test]]
name = "integration_auth"
path = "tests/integration/test_auth_flow.rs"

[[test]]
name = "integration_chat"
path = "tests/integration/test_chat_e2e.rs"

[[test]]
name = "integration_streaming"
path = "tests/integration/test_streaming_e2e.rs"

[[test]]
name = "integration_error_handling"
path = "tests/integration/test_error_handling.rs"

[[test]]
name = "integration_performance"
path = "tests/integration/test_performance.rs"

[[test]]
name = "integration_vertex_e2e"
path = "tests/integration/test_vertex_e2e.rs"

[[test]]
name = "integration_streaming_validation"
path = "tests/integration/test_streaming_validation.rs"

[dev-dependencies]
tokio-test = "0.4"
axum-test = "18.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12.23", features = ["json", "stream"] }
futures-util = "0.3"
