openapi: 3.0.3
info:
  title: LLM Supabase Rust - OpenAI Compatible API
  description: |
    OpenAI-compatible API service that routes requests to Google Vertex AI Claude models.
    Focuses on chat completions with authentication, streaming, and provider fallback.
  version: "0.1.0"
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.example.com
    description: Production server

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns service health status for monitoring
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/chat/completions:
    post:
      tags:
        - Chat
      summary: Create chat completion
      description: |
        Creates a model response for the given chat conversation.
        Compatible with OpenAI Chat Completions API.
        Routes requests to Google Vertex AI Claude 4 Sonnet model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Successful completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatCompletionChunk'
              example: |
                data: {"id":"chatcmpl-123","object":"chat.completion.chunk","created":1677652288,"model":"claude-4-sonnet-20250514","choices":[{"index":0,"delta":{"role":"assistant"},"finish_reason":null}]}

                data: {"id":"chatcmpl-123","object":"chat.completion.chunk","created":1677652288,"model":"claude-4-sonnet-20250514","choices":[{"index":0,"delta":{"content":"Hello"},"finish_reason":null}]}

                data: {"id":"chatcmpl-123","object":"chat.completion.chunk","created":1677652288,"model":"claude-4-sonnet-20250514","choices":[{"index":0,"delta":{"content":" there!"},"finish_reason":"stop"}]}

                data: [DONE]
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable - provider errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/models:
    get:
      tags:
        - Models
      summary: List available models
      description: |
        Returns a list of available models.
        Currently supports Claude 4 Sonnet via Vertex AI.
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token

  schemas:
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: ID of the model to use
          example: "claude-4-sonnet-20250514"
          enum:
            - "claude-4-sonnet-20250514"
        messages:
          type: array
          description: List of messages comprising the conversation
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Message'
        max_tokens:
          type: integer
          description: Maximum number of tokens to generate
          minimum: 1
          maximum: 200000
          default: 1000
        temperature:
          type: number
          description: Sampling temperature (0-2)
          minimum: 0
          maximum: 2
          default: 1
        top_p:
          type: number
          description: Nucleus sampling parameter (0-1)
          minimum: 0
          maximum: 1
          default: 1
        stream:
          type: boolean
          description: Enable streaming responses via Server-Sent Events
          default: false
        user:
          type: string
          description: Unique identifier for the end-user
          maxLength: 255

    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: Role of the message author
          enum:
            - "system"
            - "user"
            - "assistant"
        content:
          type: string
          description: Content of the message
          maxLength: 1000000
        name:
          type: string
          description: Name of the participant (optional)
          maxLength: 64

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: Unique identifier for the completion
          example: "chatcmpl-123"
        object:
          type: string
          description: Object type
          enum:
            - "chat.completion"
        created:
          type: integer
          description: Unix timestamp of when the completion was created
          example: 1677652288
        model:
          type: string
          description: Model used for the completion
          example: "claude-4-sonnet-20250514"
        choices:
          type: array
          description: List of completion choices
          items:
            $ref: '#/components/schemas/Choice'
        usage:
          $ref: '#/components/schemas/Usage'

    ChatCompletionChunk:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: Unique identifier for the completion
        object:
          type: string
          enum:
            - "chat.completion.chunk"
        created:
          type: integer
          description: Unix timestamp
        model:
          type: string
          description: Model used
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChunkChoice'

    Choice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
          description: Index of the choice
        message:
          $ref: '#/components/schemas/Message'
        finish_reason:
          type: string
          description: Reason the model stopped generating
          enum:
            - "stop"
            - "length"
            - "content_filter"
          nullable: true

    ChunkChoice:
      type: object
      required:
        - index
        - delta
      properties:
        index:
          type: integer
          description: Index of the choice
        delta:
          $ref: '#/components/schemas/Delta'
        finish_reason:
          type: string
          description: Reason the model stopped generating
          enum:
            - "stop"
            - "length"
            - "content_filter"
          nullable: true

    Delta:
      type: object
      properties:
        role:
          type: string
          description: Role (only in first chunk)
          enum:
            - "assistant"
        content:
          type: string
          description: Incremental content
          nullable: true

    Usage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          description: Number of tokens in the prompt
        completion_tokens:
          type: integer
          description: Number of tokens in the completion
        total_tokens:
          type: integer
          description: Total number of tokens

    ModelListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum:
            - "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    Model:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
      properties:
        id:
          type: string
          description: Model identifier
          example: "claude-4-sonnet-20250514"
        object:
          type: string
          enum:
            - "model"
        created:
          type: integer
          description: Unix timestamp of model creation
        owned_by:
          type: string
          description: Organization that owns the model
          example: "anthropic-vertex"

    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - "healthy"
            - "degraded"
            - "unhealthy"
        version:
          type: string
          description: Service version
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp
        providers:
          type: object
          description: Provider health status
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                  - "available"
                  - "unavailable"
                  - "degraded"
              latency_ms:
                type: integer
                description: Provider response latency

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
          properties:
            message:
              type: string
              description: Human-readable error message
            type:
              type: string
              description: Error type
              enum:
                - "invalid_request_error"
                - "authentication_error"
                - "permission_error"
                - "rate_limit_error"
                - "server_error"
            code:
              type: string
              description: Error code for programmatic handling
            param:
              type: string
              description: Parameter that caused the error
              nullable: true

tags:
  - name: Health
    description: Health and monitoring endpoints
  - name: Chat
    description: Chat completion operations
  - name: Models
    description: Model information and capabilities